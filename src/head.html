<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f0ede7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="バスマップ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>坂戸・鶴ヶ島 コミュニティバス マップ</title>
<style>
:root{
  --ink:#1c1c1e;--ink2:#3c3c43;--mute:#8a8a8e;--sep:rgba(60,60,67,.14);--bg:#f0ede7;
  --glass:rgba(250,250,250,.8);--card:rgba(255,255,255,.72);--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.2);--blue:#007aff;--press:rgba(0,0,0,.06);
  --shadow:0 0 0 .5px rgba(0,0,0,.08),0 10px 36px rgba(0,0,0,.16);
  --ease:cubic-bezier(.32,.72,0,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
}
[data-theme=dark]{
  --ink:#f2f2f7;--ink2:#d1d1d6;--mute:#98989f;--sep:rgba(120,120,128,.3);--bg:#1d222d;
  --glass:rgba(32,34,40,.78);--card:rgba(120,120,128,.18);--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);--blue:#0a84ff;--press:rgba(255,255,255,.08);
  --shadow:0 0 0 .5px rgba(255,255,255,.1),0 10px 36px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
input{-webkit-user-select:text;user-select:text}
#sat{position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top,0px);visibility:hidden}#sab{position:fixed;bottom:0;left:0;width:0;height:env(safe-area-inset-bottom,0px);visibility:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
#map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
#map.drag{cursor:grabbing}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);box-shadow:var(--shadow)}
/* panel */
#panel{position:fixed;left:14px;top:14px;bottom:14px;width:376px;border-radius:20px;display:flex;flex-direction:column;overflow:hidden;z-index:10}
.grab{display:none}
#stack{position:relative;flex:1;min-height:0;overflow:hidden}
.page{position:absolute;inset:0;display:flex;flex-direction:column;will-change:transform;clip-path:inset(0 0 0 0);transition:transform .46s var(--ease),clip-path .46s var(--ease),opacity .46s var(--ease)}
.page.enter{transform:translateX(100%)}
.page.behind{transform:translateX(-28%);clip-path:inset(0 72% 0 0);opacity:.55;pointer-events:none}
.page.leave{transform:translateX(100%)}
.page.dragx{transition:none}
.page.scrolled .nav{box-shadow:0 .5px 0 var(--sep)}
.nav{flex:none;display:flex;align-items:center;gap:10px;padding:14px 14px 10px;min-height:58px;touch-action:none;transition:box-shadow .2s}
.nav h2{flex:1;min-width:0;margin:0 0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .sub{display:block;font-size:13px;font-weight:400;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{flex:none;width:32px;height:32px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--ink2);transition:transform .15s,background .15s}
.ic:active{transform:scale(.9);background:var(--fill2)}
.ic svg{width:17px;height:17px}
.ic.on{color:#ff9f0a}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 0 28px}
.search{flex:1;display:flex;align-items:center;gap:7px;background:var(--fill);border-radius:12px;padding:0 10px;height:40px;min-width:0;text-align:left;color:var(--mute);font-size:16px}
.search svg{flex:none;opacity:.6}
.search input{flex:1;border:0;background:none;outline:none;font:inherit;font-size:16px;color:var(--ink);min-width:0}
.search input::placeholder{color:var(--mute)}
.search .clr{flex:none;width:18px;height:18px;border-radius:50%;background:var(--mute);color:var(--bg);display:grid;place-items:center;opacity:.75}.search .clr[hidden]{display:none}.search .clr svg{width:10px;height:10px;opacity:1}
.txt{color:var(--blue);font-size:16px;padding:6px 2px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:2px 14px 0;position:relative}
.seg button{flex:1;height:30px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink2);position:relative;z-index:1;transition:color .2s}
.seg button.on{font-weight:600;color:var(--ink)}
.seg i{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/3);border-radius:7px;background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.14);transition:transform .34s var(--ease)}
[data-theme=dark] .seg i{background:rgba(120,120,128,.5)}
.sec{font-size:13px;font-weight:600;color:var(--mute);padding:18px 18px 7px;display:flex;align-items:baseline;gap:6px}
.sec small{font-weight:400;font-size:12px}
.card{background:var(--card);border-radius:14px;margin:0 12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;position:relative;transition:background .12s}
.row+.row::before{content:"";position:absolute;left:58px;right:0;top:0;border-top:.5px solid var(--sep)}
.row:active{background:var(--press)}
.badge{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--c);color:#fff}
.badge svg{width:19px;height:19px}
.badge.lg{width:44px;height:44px;border-radius:12px}.badge.lg svg{width:25px;height:25px}
.badge.dot{background:none;box-shadow:inset 0 0 0 2.5px var(--ink2);border-radius:50%;width:22px;height:22px;margin:0 6px}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt>span{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.chev{flex:none;color:var(--mute);opacity:.55;width:8px;height:14px}
.tag{font-size:11px;font-weight:600;color:color-mix(in srgb,var(--c) 62%,var(--ink));background:color-mix(in srgb,var(--c) 18%,transparent);border-radius:5px;padding:1px 6px;margin-left:5px;vertical-align:1px}
.dots{display:flex;gap:3px;flex:none;max-width:38%;flex-wrap:wrap;justify-content:flex-end}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.acts{display:flex;gap:8px;padding:2px 12px 0}
.act{flex:1;height:46px;border-radius:13px;background:var(--fill);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s,background .15s}
.act:active{transform:scale(.97);background:var(--fill2)}
.act.pri{background:var(--blue);color:#fff}
.act.sq{flex:none;width:46px}
.act.faved{color:#ff9f0a}
.act.faved svg{color:#ff9f0a}
.act svg{width:17px;height:17px}
.facts{display:flex;gap:8px;padding:0 12px}
.fact{flex:1;background:var(--card);border-radius:12px;padding:8px 11px;min-width:0}
.fact small{display:block;font-size:11.5px;color:var(--mute)}
.fact b{font-size:15px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ol.tl{list-style:none;margin:0;padding:0}
ol.tl li{position:relative;display:flex;align-items:flex-start;gap:10px;padding:9px 14px 9px 50px;cursor:pointer;min-height:44px;transition:background .12s}
ol.tl li:active,ol.tl li.hl{background:color-mix(in srgb,var(--c) 13%,transparent)}
ol.tl li::before{content:"";position:absolute;left:24px;top:0;bottom:0;width:6px;margin-left:-3px;background:var(--c)}
ol.tl li:first-child::before{top:20px;border-radius:3px 3px 0 0}ol.tl li:last-child::before{bottom:calc(100% - 20px);border-radius:0 0 3px 3px}
ol.tl li::after{content:"";position:absolute;left:24px;top:20px;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;border:3px solid var(--c);box-sizing:border-box}
ol.tl li.t::after{width:16px;height:16px;margin:-8px 0 0 -8px;border-width:4px}
ol.tl li.mini{min-height:30px;padding-top:4px;padding-bottom:4px}ol.tl li.mini::after{top:15px;width:8px;height:8px;margin:-4px 0 0 -4px;border-width:2px}
ol.tl li.mini .sn b{font-size:13.5px;font-weight:500;color:var(--ink2)}
.sn{flex:1;min-width:0}
.sn b{font-size:15.5px;font-weight:600;display:block}
.sn i{font-style:normal;font-size:12px;color:var(--mute);display:block}
.xfer{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.xfer em{font-style:normal;font-size:10.5px;font-weight:600;color:#fff;background:var(--c);border-radius:4px;padding:1px 5px;line-height:1.5}
.num{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;padding-top:2px}
.note{font-size:11.5px;color:var(--mute);line-height:1.65;padding:16px 18px 0}
.note a{color:var(--blue);text-decoration:none}
.empty{padding:28px 22px;text-align:center;color:var(--mute);font-size:14px;line-height:1.6}
/* planner */
.od{margin:0 12px;background:var(--card);border-radius:14px;position:relative}
.od button.f{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 52px 13px 14px;font-size:16px;position:relative}
.od button.f+button.f::before{content:"";position:absolute;left:40px;right:0;top:0;border-top:.5px solid var(--sep)}
.od .pin{width:12px;height:12px;border-radius:50%;border:3px solid var(--mute);flex:none}
.od .pin.b{border-color:var(--blue);background:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent)}
.od .ph{color:var(--mute)}
.od .f.active{background:color-mix(in srgb,var(--blue) 12%,transparent)}
.od .swap{position:absolute;right:10px;top:50%;margin-top:-16px}
.leg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.leg .badge{width:26px;height:26px;border-radius:7px}.leg .badge svg{width:15px;height:15px}
.leg s{text-decoration:none;color:var(--mute);font-size:13px}
.res{display:block;width:100%;text-align:left;padding:13px 14px;position:relative;transition:background .12s}
.res+.res::before{content:"";position:absolute;left:14px;right:0;top:0;border-top:.5px solid var(--sep)}
.res:active{background:var(--press)}
.res b{display:block;font-size:17px;font-weight:700;margin-bottom:7px}
.res b small{font-size:13px;font-weight:400;color:var(--mute);margin-left:6px}
.xf{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 50px;font-size:13px;color:var(--mute);position:relative}
.xf::before{content:"";position:absolute;left:23px;top:0;bottom:0;border-left:2px dotted var(--mute);opacity:.6}
.lh{display:flex;align-items:center;gap:10px;padding:10px 14px 4px}
.lh b{font-size:15px;font-weight:700}.lh span{font-size:13px;color:var(--mute)}
/* map settings card */
.tiles{display:flex;gap:12px;padding:4px 14px 2px}
.tile{flex:1;text-align:center;font-size:13px;font-weight:500;color:var(--ink2)}
.tile .pv{display:block;border-radius:12px;overflow:hidden;aspect-ratio:1.42;box-shadow:0 0 0 .5px var(--sep);transition:box-shadow .2s,transform .15s;margin-bottom:7px}
.tile .pv svg{display:block;width:100%;height:100%}
.tile:active .pv{transform:scale(.97)}
.tile.on{color:var(--blue);font-weight:600}
.tile.on .pv{box-shadow:0 0 0 3px var(--blue)}
.seg.wide{margin:0 14px}
.hint{font-size:12.5px;color:var(--mute);line-height:1.55;padding:10px 18px 0}
/* map controls */
#ctrl{position:fixed;right:14px;top:14px;z-index:9;display:flex;flex-direction:column;gap:10px;transition:opacity .25s}
#ctrl.off{opacity:0;pointer-events:none}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9;transition:opacity .52s var(--ease)}
body.sheet-drag #dim{transition:none}
.grp{border-radius:13px;overflow:hidden;display:flex;flex-direction:column}
.grp button{width:44px;height:44px;display:grid;place-items:center;color:var(--ink2);transition:background .12s}
.grp button+button{border-top:.5px solid var(--sep)}
.grp button:active{background:var(--press)}
.grp svg{width:20px;height:20px}
#scale{position:fixed;right:16px;bottom:26px;z-index:8;font-size:11px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:flex-end;gap:2px;pointer-events:none;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
#scale i{display:block;height:4px;border:1.5px solid var(--ink2);border-top:0}
#attr{position:fixed;right:12px;bottom:8px;z-index:8;font-size:10px;color:var(--mute)}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-80px);z-index:30;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;transition:transform .45s var(--ease);pointer-events:none;white-space:nowrap}
#toast.on{transform:translate(-50%,0)}
@media (max-width:720px){
  #panel{left:0;right:0;top:var(--topgap,54px);bottom:auto;width:auto;height:calc(100% - var(--topgap,54px));border-radius:16px 16px 0 0;transform:translate3d(0,var(--ty,56%),0);transition:transform .52s var(--ease);will-change:transform}
  #panel.dragging{transition:none}
  #panel.locked .scroll{overflow:hidden}
  .scroll{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
  .grab{display:block;flex:none;height:18px;touch-action:none;position:relative}
  .grab::after{content:"";position:absolute;left:50%;top:6px;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:var(--mute);opacity:.55}
  .nav{padding-top:2px;min-height:50px}
  #ctrl{top:calc(10px + env(safe-area-inset-top));right:10px}
  #ctrl .zoom{display:none}
  #scale{bottom:auto;right:auto;left:14px;top:calc(14px + env(safe-area-inset-top));align-items:flex-start;opacity:0;transition:opacity .35s}
  #scale.on{opacity:1;transition:opacity .12s}
  #attr{display:none}
  #toast{top:calc(12px + env(safe-area-inset-top))}
}
@media (prefers-reduced-motion:reduce){.page,#panel,.seg i,#dim{transition-duration:.01s}}
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="scale"><span id="sl"></span><i id="sb"></i></div>
<div id="ctrl">
  <div class="grp glass"><button id="mode" aria-label="マップの表示設定"></button><button id="zfit" aria-label="全体を表示"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
  <div class="grp glass zoom"><button id="zin" aria-label="拡大"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><button id="zout" aria-label="縮小"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button></div>
</div>
<div id="dim"></div><div id="sat"></div><div id="sab"></div>
<aside id="panel" class="glass"><div class="grab" id="grab"></div><div id="stack"></div></aside>
<div id="attr">地図・路線：坂戸市／鶴ヶ島市 路線図より作成</div>
<div id="toast" class="glass"></div>
<script>
